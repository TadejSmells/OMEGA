<!DOCTYPE html>
<html>
<head>
    <title>Registracija</title>
</head>
<body>
    <h2>Registracija</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <p style="color: {% if category == 'error' %}red{% else %}green{% endif %};">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="/register">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="username" placeholder="Uporabniško ime" required><br><br>
        <input type="password" name="password" placeholder="Geslo (min. 6 znakov)" required><br><br>
        <select name="vloga">
            <option value="stranka">Stranka</option>
            <option value="frizer">Frizer</option>
            <option value="admin">Admin</option>
        </select><br><br>
        <button type="submit">Registriraj se</button>
    </form>

    <a href="/login">Že imaš račun? Prijava</a>
</body>
</html>
