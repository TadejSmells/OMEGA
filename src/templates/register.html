{% extends "base.html" %}
{% block title %}Registracija{% endblock %}

{% block content %}

<div class="auth-page">
    <a href="/" class="back-btn">&#8617;</a>

    <div class="auth-panel">
        <div class="profil-ikona">&#128100;</div>

        <h2>Registracija</h2>

        <form method="POST" action="/register" class="obrazec" onsubmit="return preveriGeslo()">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="polje">
                <label for="username">Uporabniško ime *</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="polje">
                <label for="password">Geslo * <small>(vsaj 6 znakov)</small></label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" required minlength="6"
                           oninput="checkConfirm()">
                    <button type="button" class="toggle-geslo"
                            onclick="toggleGeslo('password', this)"
                            title="Pokaži geslo">👁</button>
                </div>
            </div>

            <div class="polje">
                <label for="password_confirm">Potrdi geslo *</label>
                <div class="password-wrap">
                    <input type="password" id="password_confirm" name="password_confirm" required
                           oninput="checkConfirm()">
                    <button type="button" class="toggle-geslo"
                            onclick="toggleGeslo('password_confirm', this)"
                            title="Pokaži geslo">👁</button>
                </div>
                <div class="geslo-napaka" id="geslo-napaka">Gesli se ne ujemata.</div>
                <div class="geslo-ujema"  id="geslo-ujema">Gesli se ujemata. ✓</div>
            </div>

            <div class="polje">
                <label for="ime">Ime</label>
                <input type="text" id="ime" name="ime">
            </div>

            <div class="polje">
                <label for="priimek">Priimek <span id="priimek_required_label"></span></label>
                <input type="text" id="priimek" name="priimek">
            </div>

            <div class="polje">
                <label for="mail">E-mail</label>
                <input type="email" id="mail" name="mail">
            </div>

            <div class="polje">
                <label for="telefon">Telefon</label>
                <input type="tel" id="telefon" name="telefon">
            </div>

            <div class="submit-wrap">
                <button type="submit" class="gumb">Registriraj se</button>
            </div>
        </form>

        <p class="auth-link">Že imaš račun? <a href="/login">Prijavi se</a></p>
    </div>
</div>

<script>

    function toggleGeslo(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
            btn.title = 'Skrij geslo';
        } else {
            input.type = 'password';
            btn.textContent = '👁';
            btn.title = 'Pokaži geslo';
        }
    }

    function checkConfirm() {
        const geslo    = document.getElementById('password').value;
        const potrdilo = document.getElementById('password_confirm').value;
        const napaka   = document.getElementById('geslo-napaka');
        const ujema    = document.getElementById('geslo-ujema');

        if (potrdilo.length === 0) {
            napaka.style.display = 'none';
            ujema.style.display  = 'none';
        } else if (geslo === potrdilo) {
            napaka.style.display = 'none';
            ujema.style.display  = 'block';
        } else {
            napaka.style.display = 'block';
            ujema.style.display  = 'none';
        }
    }

    function preveriGeslo() {
        const geslo    = document.getElementById('password').value;
        const potrdilo = document.getElementById('password_confirm').value;
        if (geslo !== potrdilo) {
            document.getElementById('geslo-napaka').style.display = 'block';
            document.getElementById('password_confirm').focus();
            return false;
        }
        return true;
    }
</script>
{% endblock %}
