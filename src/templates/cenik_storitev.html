{% extends "base.html" %}
{% block title %}Cenik storitev{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --beige: #D9B99F; --light: #F2E7DD; --peach: #F2D6CE;
        --brown: #A75F37; --rose: #CA8E82; --dark: #292421; --white: #FFFFFF;
        --font-head: 'Inknut Antiqua', serif; --font-body: 'Inter', sans-serif;
    }
    body { font-family: var(--font-body); background: var(--light); color: var(--dark); }
    .page-header {
        background: var(--beige); padding: 14px 32px;
        display: flex; align-items: center; justify-content: space-between;
    }
    .page-header-title {
        font-family: var(--font-head); font-size: 1.5rem; font-weight: 700;
        letter-spacing: 0.06em; color: var(--dark);
    }
    .vsebina { padding: 24px 32px; max-width: 700px; margin: 0 auto; }
    .storitev-item {
        background: var(--white); border: 1px solid var(--peach);
        border-radius: 12px; padding: 16px 20px; margin-bottom: 10px;
        display: flex; justify-content: space-between; align-items: center;
    }
    .storitev-ime { font-size: 14px; color: var(--dark); font-weight: 500; }
    .storitev-cena { font-size: 18px; color: var(--brown); font-weight: 700; }
    .storitev-trajanje { font-size: 11px; color: #7A958F; margin-top: 2px; }
    .prazno { text-align: center; color: #aaa; padding: 40px; font-style: italic; }
</style>

<div class="page-header">
    <div class="page-header-title">CENIK STORITEV</div>
    <a href="/profil" style="width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;">&#128100;</a>
</div>

<div class="vsebina">
    {% if podatki %}
        {% for row in podatki %}
        <div class="storitev-item">
            <div>
                <div class="storitev-ime">{{ row[1] }}</div>
                <div class="storitev-trajanje">Trajanje: {{ row[3] }}</div>
            </div>
            <div class="storitev-cena">{{ row[2] }} €</div>
        </div>
        {% endfor %}
    {% else %}
        <div class="prazno">Ni storitev v bazi.</div>
    {% endif %}
</div>
{% endblock %}
