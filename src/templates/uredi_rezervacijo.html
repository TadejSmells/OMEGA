{% extends "base.html" %}
{% block title %}Uredi rezervacijo{% endblock %}

{% block content %}

<div class="admin-page">
    <a href="/rezervacije" class="back-btn">&#8617;</a>

    <div class="small-form-box">
        <h1>Uredi rezervacijo</h1>
        <div class="form-line"></div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if rezervacija is defined %}
                <input type="hidden" name="stranka_id" value="{{ rezervacija[1] }}">
            {% endif %}

            <div class="form-row">
                <label>Datum</label>
                <input type="date" name="datum"
                       value="{% if rezervacija is defined %}{{ rezervacija[5] }}{% endif %}" required>
            </div>

            <div class="form-row">
                <label>Ura</label>
                <input type="time" name="ura"
                       value="{% if rezervacija is defined %}{{ rezervacija[6] }}{% endif %}" required>
            </div>

            <div class="form-row">
                <label>Frizer</label>
                <select name="frizer_id" required>
                    <option value="">— izberi —</option>
                    {% for f in frizerji %}
                        <option value="{{ f[0] }}" {% if rezervacija is defined and f[0] == rezervacija[2] %}selected{% endif %}>
                            {{ f[2] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label>Salon</label>
                <select name="salon_id">
                    <option value="">— izberi —</option>
                    {% for s in saloni %}
                        <option value="{{ s[0] }}" {% if rezervacija is defined and s[0] == rezervacija[3] %}selected{% endif %}>
                            {{ s[1] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label>Storitev</label>
                <select name="storitev_id">
                    <option value="">— izberi —</option>
                    {% for st in storitve %}
                        <option value="{{ st[0] }}" {% if rezervacija is defined and st[0] == rezervacija[4] %}selected{% endif %}>
                            {{ st[1] }}{% if st[2] %} ({{ st[2] }} €){% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-line" style="margin-top:12px;"></div>

            <div class="form-row" style="grid-template-columns:90px 1fr 1fr;">
                <label></label>
                <button type="submit" class="mini-btn">Shrani</button>
                <a href="/rezervacije" class="mini-btn" style="text-align:center;">Prekliči</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
