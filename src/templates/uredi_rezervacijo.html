{% extends "base.html" %}
{% block title %}Urejanje rezervacije{% endblock %}

{% block content %}
<style>
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #F2E7DD;
        color: #292421;
    }

    main {
        min-height: calc(100vh - 140px);
        display: flex;
        flex-direction: column;
    }

    .page-header {
        background: #D9B99F;
        padding: 12px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .page-header-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
        font-weight: 700;
        color: #292421;
        letter-spacing: 0.02em;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .header-username {
        font-size: 13px;
        color: #292421;
        background: rgba(255,255,255,0.7);
        padding: 7px 18px;
        border-radius: 20px;
    }

    .user-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255,255,255,0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        font-size: 22px;
        color: #D9B99F;
    }

    .navbar {
        background: #A75F37;
        display: flex;
    }

    .navbar a {
        font-size: 13px;
        color: #FFFFFF;
        text-decoration: none;
        padding: 10px 28px;
        display: block;
        font-weight: 600;
    }

    .navbar a.active {
        background: rgba(0,0,0,0.2);
    }

    .navbar a:hover {
        background: rgba(0,0,0,0.15);
    }

    .uredi-page {
        flex: 1;
        min-height: calc(100vh - 310px);
        background: linear-gradient(90deg, #FFFFFF 0 30%, #F2E7DD 30% 70%, #FFFFFF 70%);
        display: flex;
        justify-content: center;
        position: relative;
        padding: 24px 32px 30px;
    }

    .back-btn {
        position: absolute;
        top: 18px;
        right: 34px;
        color: #CA8E82;
        font-size: 28px;
        text-decoration: none;
    }

    .panel {
        width: 430px;
        min-height: 390px;
        padding: 26px 42px 24px;
        background: #F2E7DD;
    }

    h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.45rem;
        text-align: center;
        margin-bottom: 10px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .line {
        height: 2px;
        background: #A75F37;
        margin: 0 auto 22px;
        width: 100%;
    }

    .form-row {
        display: grid;
        grid-template-columns: 105px 1fr;
        align-items: center;
        gap: 16px;
        margin-bottom: 11px;
    }

    .form-row label {
        font-size: 14px;
        font-weight: 700;
        color: #111111;
    }

    select,
    input {
        width: 100%;
        height: 24px;
        border: none;
        border-radius: 20px;
        background: #FFFFFF;
        padding: 0 12px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        color: #292421;
        outline: none;
        text-align: center;
    }

    .button-row {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #CA8E82;
        font-size: 12px;
    }

    .check-box {
        width: 20px;
        height: 20px;
        border: 1px solid #D9B99F;
        border-radius: 4px;
        background: #F2E7DD;
        display: inline-block;
    }

    .submit-btn,
    .cancel-link {
        border: none;
        background: transparent;
        color: #CA8E82;
        font-size: 12px;
        cursor: pointer;
        text-decoration: none;
        font-family: Arial, Helvetica, sans-serif;
    }

    .submit-btn:hover,
    .cancel-link:hover {
        text-decoration: underline;
    }

    .nav-footer {
        background: #D9B99F;
        padding: 7px 60px;
        display: flex;
        justify-content: space-between;
    }

    .nav-footer a {
        font-size: 13px;
        color: #292421;
        text-decoration: none;
        font-style: italic;
    }

    .nav-footer a:hover {
        text-decoration: underline;
    }

    @media (max-width: 800px) {
        .page-header {
            padding: 12px 18px;
        }

        .page-header-title {
            font-size: 1.4rem;
        }

        .navbar a {
            padding: 10px 14px;
            font-size: 12px;
        }

        .uredi-page {
            background: #F2E7DD;
            padding: 20px 18px;
        }

        .panel {
            width: 100%;
            padding: 24px 20px;
        }

        .form-row {
            grid-template-columns: 1fr;
            gap: 6px;
        }
    }
</style>

<div class="uredi-page">
    <a href="/rezervacije" class="back-btn">&#8617;</a>

    <div class="panel">
        <h1>Uredi rezervacijo</h1>
        <div class="line"></div>

        <form method="POST">
            {% if rezervacija is defined %}
                <input type="hidden" name="stranka_id" value="{{ rezervacija[1] }}">
            {% endif %}

            <div class="form-row">
                <label for="datum">Datum</label>
                <input type="date" id="datum" name="datum">
            </div>

            <div class="form-row">
                <label for="ura">Ura</label>
                <input type="time" id="ura" name="ura">
            </div>

            <div class="form-row">
                <label for="frizer_id">Frizer/ka</label>
                <select name="frizer_id" id="frizer_id" required>
                    <option value="">-izberi-</option>
                    {% for f in frizerji %}
                        <option value="{{ f[0] }}" {% if rezervacija is defined and f[0] == rezervacija[2] %}selected{% endif %}>
                            {{ f[2] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label for="salon_id">Salon</label>
                <select name="salon_id" id="salon_id">
                    <option value="">-izberi-</option>
                    {% for s in saloni %}
                        <option value="{{ s[0] }}" {% if rezervacija is defined and s[0] == rezervacija[3] %}selected{% endif %}>
                            {{ s[1] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label for="storitev_id">Storitve</label>
                <select name="storitev_id" id="storitev_id">
                    <option value="">-izberi-</option>
                    {% for st in storitve %}
                        <option value="{{ st[0] }}" {% if rezervacija is defined and st[0] == rezervacija[4] %}selected{% endif %}>
                            {{ st[1] }}{% if st[2] %} ({{ st[2] }} €){% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="button-row">
                <span class="check-box"></span>
                <button type="submit" class="submit-btn">Shrani</button>
                <a href="/rezervacije" class="cancel-link">Prekliči</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
