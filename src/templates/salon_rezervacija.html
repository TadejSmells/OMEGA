{% extends "base.html" %}
{% block title %}Rezervacije{% endblock %}

{% block content %}

<div class="rezervacije-page">
    <div class="rezervacije-panel">
        <div class="profil-ikona">&#128197;</div>

        <h2>Nova rezervacija</h2>

        <form method="POST" action="/rezervacije" class="obrazec">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="polje">
                <label for="stranka_id">Stranka</label>
                <select name="stranka_id" id="stranka_id" required>
                    {% if stranke|length > 1 %}
                        <option value="" disabled selected>— izberi stranko —</option>
                    {% endif %}
                    
                    {% for stranka in stranke %}
                        <option value="{{ stranka[0] }}" {% if stranke|length == 1 %}selected{% endif %}>
                            {{ stranka[1] }} {{ stranka[2] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="polje">
                <label for="frizer_id">Frizer</label>
                <select name="frizer_id" id="frizer_id" required>
                    <option value="" disabled selected>— izberi frizerja —</option>
                    {% for frizer in frizerji %}
                        <option value="{{ frizer[0] }}">{{ frizer[2] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="polje">
                <label for="salon_id">Salon</label>
                <select name="salon_id" id="salon_id">
                    <option value="">— brez salona —</option>
                    {% for salon in saloni %}
                        <option value="{{ salon[0] }}">{{ salon[1] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="polje">
                <label for="storitev_id">Storitev</label>
                <select name="storitev_id" id="storitev_id">
                    <option value="">— brez storitve —</option>
                    {% for storitev in storitve %}
                        <option value="{{ storitev[0] }}">
                            {{ storitev[1] }} — {{ storitev[2] }} € ({{ storitev[3] }} min)
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="datum-ura">
                <div class="polje">
                    <label for="datum">Datum</label>
                    <input type="date" id="datum" name="datum" required>
                </div>

                <div class="polje">
                    <label for="ura">Ura</label>
                    <input type="time" id="ura" name="ura" required>
                </div>
            </div>

            <div class="submit-wrap">
                <button type="submit" class="gumb">＋ Dodaj rezervacijo</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
