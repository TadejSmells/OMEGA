{% extends "base.html" %}
{% block title %}Rezervacije{% endblock %}

{% block content %}
<div class="container mt-4">

  <!-- ── PAGE HEADER ───────────────────────────────────────────── -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">🗓️ Rezervacije</h2>
    <a href="/" class="btn btn-outline-secondary btn-sm">← Domov</a>
  </div>

  <div class="row g-4">

    <!-- ── ADD FORM ─────────────────────────────────────────────── -->
    <div class="col-lg-4">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Nova rezervacija</h5>
        </div>
        <div class="card-body">
          <form method="POST" action="/rezervacije">

            <div class="mb-3">
              <label for="stranka_id" class="form-label fw-semibold">Stranka</label>
              <select class="form-select" id="stranka_id" name="stranka_id" required>
                <option value="" disabled selected>— izberi stranko —</option>
                {% for stranka in stranke %}
                <option value="{{ stranka[0] }}">
                  {{ stranka[1] }} {{ stranka[2] }}
                </option>
                {% endfor %}
              </select>
            </div>

            <div class="mb-3">
              <label for="frizer_id" class="form-label fw-semibold">Frizer</label>
              <select class="form-select" id="frizer_id" name="frizer_id" required>
                <option value="" disabled selected>— izberi frizerja —</option>
                {% for frizer in frizerji %}
                <option value="{{ frizer[0] }}">{{ frizer[2] }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="mb-3">
              <label for="salon_id" class="form-label fw-semibold">Salon</label>
              <select class="form-select" id="salon_id" name="salon_id">
                <option value="">— brez salona —</option>
                {% for salon in saloni %}
                <option value="{{ salon[0] }}">{{ salon[1] }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="mb-4">
              <label for="storitev_id" class="form-label fw-semibold">Storitev</label>
              <select class="form-select" id="storitev_id" name="storitev_id">
                <option value="">— brez storitve —</option>
                {% for storitev in storitve %}
                <option value="{{ storitev[0] }}">
                  {{ storitev[1] }} — {{ storitev[2] }} € ({{ storitev[3] }} min)
                </option>
                {% endfor %}
              </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              ＋ Dodaj rezervacijo
            </button>
          </form>
        </div>
      </div>
    </div>
    {% endblock %}
