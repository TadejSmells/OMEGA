{% extends "base.html" %}
{% block title %}Nova rezervacija{% endblock %}

{% block content %}

<div class="admin-page">
    <a href="/" class="back-btn">&#8617;</a>

    <div class="small-form-box">
        <h1>Nova rezervacija</h1>
        <div class="form-line"></div>

        <form method="POST" action="/rezervacije">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-row">
                <label>Stranka</label>
                <select name="stranka_id" required>
                    {% if stranke|length > 1 %}
                        <option value="" disabled selected>— izberi stranko —</option>
                    {% endif %}
                    {% for stranka in stranke %}
                        <option value="{{ stranka[0] }}" {% if stranke|length == 1 %}selected{% endif %}>
                            {{ stranka[1] }} {{ stranka[2] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label>Frizer</label>
                <select name="frizer_id" required>
                    <option value="" disabled selected>— izberi frizerja —</option>
                    {% for frizer in frizerji %}
                        <option value="{{ frizer[0] }}">{{ frizer[2] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label>Salon</label>
                <select name="salon_id">
                    <option value="">— brez salona —</option>
                    {% for salon in saloni %}
                        <option value="{{ salon[0] }}">{{ salon[1] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label>Storitev</label>
                <select name="storitev_id">
                    <option value="">— brez storitve —</option>
                    {% for storitev in storitve %}
                        <option value="{{ storitev[0] }}">
                            {{ storitev[1] }} — {{ storitev[2] }} €
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-line" style="margin-top:12px;"></div>

            <div class="form-row">
                <label>Datum</label>
                <input type="date" name="datum" required>
            </div>

            <div class="form-row">
                <label>Ura</label>
                <input type="time" name="ura" required>
            </div>

            <div class="form-row" style="grid-template-columns:90px 1fr; margin-top:10px;">
                <label></label>
                <button type="submit" class="mini-btn">＋ Dodaj rezervacijo</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
