{% extends "base.html" %}
{% block title %}Prijava{% endblock %}

{% block content %}

<div class="auth-page">
    <a href="/" class="back-btn">&#8617;</a>

    <div class="auth-panel">
        <div class="profil-ikona">&#128100;</div>

        <h2>Prijava</h2>

        <form method="POST" action="/login" class="obrazec">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="polje">
                <label for="username">Uporabniško ime</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="polje">
                <label for="password">Geslo</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="toggle-geslo" onclick="toggleGeslo()" aria-label="Pokaži/skrij geslo" title="Pokaži/skrij geslo">
                        👁
                    </button>
                </div>
            </div>

            <div class="submit-wrap">
                <button type="submit" class="gumb">Prijavi se</button>
            </div>
        </form>

        <p class="auth-link">Nimaš računa? <a href="/register">Registriraj se</a></p>
    </div>
</div>

<script>
    function toggleGeslo() {
        const input = document.getElementById('password');
        const btn   = document.querySelector('.toggle-geslo');
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
            btn.title = 'Skrij geslo';
        } else {
            input.type = 'password';
            btn.textContent = '👁';
            btn.title = 'Pokaži geslo';
        }
    }
</script>
{% endblock %}
