{% extends "base.html" %}
{% block title %}Prijava{% endblock %}

{% block content %}
<style>
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #F2E7DD;
        color: #292421;
    }

    main {
        min-height: calc(100vh - 140px);
        display: flex;
        flex-direction: column;
    }

    .auth-page {
        flex: 1;
        min-height: calc(100vh - 170px);
        background: #F2E7DD;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        padding: 28px 32px;
    }

    .back-btn {
        position: absolute;
        top: 18px;
        right: 34px;
        color: #CA8E82;
        font-size: 30px;
        text-decoration: none;
    }

    .auth-panel {
        width: 420px;
        background: #F2E7DD;
        padding: 38px 52px 34px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .profil-ikona {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: #FFFFFF;
        color: #D9B99F;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 72px;
        margin-bottom: 28px;
    }

    .obrazec {
        width: 100%;
    }

    h2 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.25rem;
        color: #111111;
        margin-bottom: 24px;
        text-align: center;
        text-transform: uppercase;
    }

    .polje {
        margin-bottom: 14px;
    }

    .polje label {
        display: block;
        font-size: 11px;
        color: #111111;
        margin-bottom: 6px;
    }

    .polje input {
        width: 100%;
        height: 32px;
        border: none;
        border-radius: 20px;
        background: #FFFFFF;
        padding: 4px 14px;
        font-size: 12px;
        outline: none;
        font-family: Arial, Helvetica, sans-serif;
    }

    .submit-wrap {
        width: 100%;
        text-align: center;
        margin-top: 28px;
    }

    .gumb {
        background: #A75F37;
        color: #FFFFFF;
        border: none;
        border-radius: 30px;
        padding: 9px 42px;
        font-size: 12px;
        cursor: pointer;
        font-weight: 600;
    }

    .gumb:hover {
        background: #CA8E82;
    }

    .auth-link {
        margin-top: 22px;
        font-size: 13px;
        color: #292421;
        text-align: center;
    }

    .auth-link a {
        color: #A75F37;
        text-decoration: none;
        font-style: italic;
    }

    .auth-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        .auth-panel {
            width: 100%;
            padding: 30px 22px;
        }
    }
</style>

<div class="auth-page">
    <a href="/" class="back-btn">&#8617;</a>

    <div class="auth-panel">
        <div class="profil-ikona">&#128100;</div>

        <h2>Prijava</h2>

        <form method="POST" action="/login" class="obrazec">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="polje">
                <label for="username">Uporabniško ime</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="polje">
                <label for="password">Geslo</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="submit-wrap">
                <button type="submit" class="gumb">Prijavi se</button>
            </div>
        </form>

        <p class="auth-link">Nimaš računa? <a href="/register">Registriraj se</a></p>
    </div>
</div>
{% endblock %}
