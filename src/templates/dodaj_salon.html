{% extends "base.html" %}
{% block title %}Dodaj salon{% endblock %}

{% block content %}

<div class="vsebina">
    <div class="form-panel">
        <div class="form-panel-header">Nov salon</div>
        <div class="form-panel-body">
            <form method="POST" action="/saloni/dodaj">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="polje">
                    <label>Ime salona *</label>
                    <input type="text" name="ime" required autofocus placeholder="npr. Salon Lepote">
                </div>
                <div class="polje">
                    <label>Naslov</label>
                    <input type="text" name="naslov" placeholder="npr. Glavna ulica 1">
                </div>
                <div class="polje">
                    <label>Mesto</label>
                    <input type="text" name="mesto" placeholder="npr. Ljubljana">
                </div>
                <div class="polje">
                    <label>Telefon</label>
                    <input type="text" name="telefon" placeholder="npr. 01-123-456">
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">＋ Dodaj salon</button>
                    <a href="/saloni" class="cancel-btn">Prekliči</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
