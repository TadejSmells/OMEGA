{% extends "base.html" %}
{% block title %}Uredi storitev{% endblock %}

{% block content %}

<div class="admin-page">
    <a href="/storitve" class="back-btn">&#8617;</a>

    <div class="small-form-box">
        <h1>Uredi storitev</h1>
        <div class="form-line"></div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-row">
                <label>Naziv</label>
                <input type="text" name="naziv" required value="{{ storitev.naziv or '' }}">
            </div>

            <div class="form-row">
                <label>Cena (€)</label>
                <input type="number" step="0.01" name="cena" value="{{ storitev.cena or '' }}">
            </div>

            <div class="form-row">
                <label>Trajanje</label>
                <input type="time" name="trajanje" value="{{ storitev.trajanje or '' }}">
            </div>

            <div class="form-row" style="grid-template-columns:90px 1fr; align-items:flex-start;">
                <label style="padding-top:6px;">Opis</label>
                <textarea name="opis" rows="4" style="border:none; border-radius:10px; background:#fff; padding:8px 12px; font-size:13px; font-family:Arial,sans-serif; outline:none; resize:vertical;">{{ storitev.opis or '' }}</textarea>
            </div>

            <div class="form-line" style="margin-top:12px;"></div>

            <div class="form-row" style="grid-template-columns:90px 1fr 1fr;">
                <label></label>
                <button type="submit" class="mini-btn">Shrani</button>
                <a href="/storitve" class="mini-btn" style="text-align:center;">Prekliči</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
