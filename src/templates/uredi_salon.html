{% extends "base.html" %}
{% block title %}Uredi salon{% endblock %}

{% block content %}
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --beige: #D9B99F; --light: #F2E7DD; --peach: #F2D6CE;
        --brown: #A75F37; --rose: #CA8E82; --dark: #292421; --white: #FFFFFF;
        --font-head: Georgia, "Times New Roman", serif;
        --font-body: Arial, Helvetica, sans-serif;
    }
    body { font-family: var(--font-body); background: var(--light); color: var(--dark); }

    .page-header {
        background: var(--beige); padding: 12px 32px;
        display: flex; align-items: center; justify-content: space-between;
    }
    .page-header-title {
        font-family: var(--font-head); font-size: 2rem; font-weight: 700;
        color: var(--dark); letter-spacing: 0.02em;
    }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .header-username { font-size: 13px; color: var(--dark); }
    .user-avatar {
        width: 44px; height: 44px; border-radius: 50%;
        background: rgba(255,255,255,0.7);
        display: flex; align-items: center; justify-content: center;
        text-decoration: none; font-size: 22px; color: var(--beige);
    }

    .navbar { background: var(--brown); display: flex; }
    .navbar a {
        font-size: 13px; color: var(--white); text-decoration: none;
        padding: 10px 28px; display: block; font-weight: 600;
    }
    .navbar a.active { background: rgba(0,0,0,0.2); }
    .navbar a:hover { background: rgba(0,0,0,0.15); }

    .vsebina { padding: 40px 32px; max-width: 480px; margin: 0 auto; }

    .form-panel {
        background: var(--white); border: 1px solid var(--peach);
        border-radius: 14px; overflow: hidden;
    }
    .form-panel-header {
        background: var(--beige); padding: 14px 20px;
        font-family: var(--font-head); font-size: 1rem;
        color: var(--dark);
    }
    .form-panel-body { padding: 24px; }

    .polje { margin-bottom: 20px; }
    .polje label {
        font-size: 11px; color: var(--dark); display: block;
        margin-bottom: 4px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.04em;
    }
    .polje input {
        width: 100%; border: none; border-bottom: 1.5px solid var(--beige);
        background: transparent; padding: 6px 0; font-size: 13px;
        outline: none; font-family: var(--font-body); color: var(--dark);
        transition: border-color 0.2s;
    }
    .polje input:focus { border-bottom-color: var(--brown); }

    .form-actions { display: flex; gap: 10px; margin-top: 8px; }
    .submit-btn {
        flex: 1; background: var(--brown); border: none; border-radius: 30px;
        padding: 12px; font-size: 13px; font-family: var(--font-body);
        color: white; cursor: pointer; transition: background 0.2s;
    }
    .submit-btn:hover { background: var(--rose); }
    .cancel-btn {
        flex: 1; background: var(--light); border: 1px solid var(--peach);
        border-radius: 30px; padding: 12px; font-size: 13px;
        font-family: var(--font-body); color: var(--dark);
        text-decoration: none; text-align: center; transition: background 0.2s;
    }
    .cancel-btn:hover { background: var(--peach); }

    .nav-footer {
        background: var(--beige); padding: 7px 60px;
        display: flex; justify-content: space-between;
    }
    .nav-footer a {
        font-size: 13px; color: var(--dark); text-decoration: none; font-style: italic;
    }
    .nav-footer a:hover { text-decoration: underline; }
</style>

<div class="vsebina">
    <div class="form-panel">
        <div class="form-panel-header">Urejanje: {{ salon.ime }}</div>
        <div class="form-panel-body">
            <form method="POST" action="/saloni/uredi/{{ salon.id }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="polje">
                    <label>Ime salona</label>
                    <input type="text" name="ime" required autofocus
                           value="{{ salon.ime or '' }}"
                           placeholder="npr. Salon Lepota">
                </div>

                <div class="polje">
                    <label>Naslov</label>
                    <input type="text" name="naslov"
                           value="{{ salon.naslov or '' }}"
                           placeholder="npr. Slovenska cesta 10">
                </div>

                <div class="polje">
                    <label>Mesto</label>
                    <input type="text" name="mesto"
                           value="{{ salon.mesto or '' }}"
                           placeholder="npr. Ljubljana">
                </div>

                <div class="polje">
                    <label>Telefon</label>
                    <input type="text" name="telefon"
                           value="{{ salon.telefon or '' }}"
                           placeholder="npr. 01 234 5678">
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">Shrani spremembe</button>
                    <a href="/saloni" class="cancel-btn">Prekliči</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
