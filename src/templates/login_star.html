{% extends "base.html" %}
{% block title %}Prijava{% endblock %}

{% block content %}
<h2>Prijava</h2>

<form method="POST" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <table>
        <tr>
            <td><label for="username">Uporabniško ime</label></td>
            <td><input type="text" id="username" name="username" required autofocus></td>
        </tr>
        <tr>
            <td><label for="password">Geslo</label></td>
            <td><input type="password" id="password" name="password" required></td>
        </tr>
        <tr>
            <td></td>
            <td><button type="submit">Prijavi se</button></td>
        </tr>
    </table>
</form>

<p>Nimaš računa? <a href="/register">Registriraj se</a></p>
{% endblock %}
