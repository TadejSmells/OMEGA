{% extends "base.html" %}
{% block title %}Termini{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --beige: #D9B99F; --light: #F2E7DD; --peach: #F2D6CE;
        --brown: #A75F37; --rose: #CA8E82; --dark: #292421; --white: #FFFFFF;
        --font-head: 'Inknut Antiqua', serif; --font-body: 'Inter', sans-serif;
    }
    body { font-family: var(--font-body); background: var(--light); color: var(--dark); }
    .page-header {
        background: var(--beige); padding: 14px 32px;
        display: flex; align-items: center; justify-content: space-between;
    }
    .page-header-title {
        font-family: var(--font-head); font-size: 1.5rem; font-weight: 700;
        letter-spacing: 0.06em; color: var(--dark);
    }
    .vsebina {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; padding: 80px 32px; text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    .naslov {
        font-family: var(--font-head); font-size: 1.2rem;
        color: var(--dark); margin-bottom: 12px; letter-spacing: 0.04em;
    }
    .opis { font-size: 13px; color: #7A958F; max-width: 400px; line-height: 1.7; margin-bottom: 32px; }
    .gumb {
        background: var(--brown); border: none; border-radius: 30px;
        padding: 12px 32px; font-size: 13px; font-family: var(--font-body);
        color: white; text-decoration: none; transition: background 0.2s;
    }
    .gumb:hover { background: var(--rose); color: white; }
</style>

<div class="page-header">
    <div class="page-header-title">TERMINI</div>
    <a href="/profil" style="width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;">&#128100;</a>
</div>

<div class="vsebina">
    <div class="icon">🗓️</div>
    <div class="naslov">Stran za termine je v razvoju</div>
    <div class="opis">Omogoča pregled in upravljanje vaših terminov. Prihaja kmalu.</div>
    <a href="/rezervacije" class="gumb">Pojdi na rezervacije →</a>
</div>
{% endblock %}
