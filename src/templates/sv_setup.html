{% extends "base.html" %}
{% block title %}Nastavitev baze{% endblock %}

{% block content %}

<div class="admin-page">
    <a href="/admin" class="back-btn">&#8617;</a>

    <div class="small-form-box">
        <h1>Nastavitev baze</h1>
        <div class="form-line"></div>

        <div class="table-scroll">
            <table class="simple-table">
                <thead>
                    <tr>
                        <th>Tabela</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for table, success in tables.items() %}
                    <tr>
                        <td>{{ table }}</td>
                        <td>
                            {% if success %}
                                <span style="color:#2E7D32; font-weight:700;">✔ OK</span>
                            {% else %}
                                <span style="color:#c0392b; font-weight:700;">✘ Napaka</span>
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div style="margin-top:16px; text-align:center;">
            <a href="/admin" class="mini-btn">← Nazaj na admin panel</a>
        </div>
    </div>
</div>

{% endblock %}
