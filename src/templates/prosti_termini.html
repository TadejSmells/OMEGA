{% extends "base.html" %}

{% block title %}Prosti termini{% endblock %}

{% block content %}

<h1>Pregled prostih terminov</h1>

<table border="1" style="width:100%; border-collapse: collapse;">

<tr>
    <th>Frizer</th>
    <th>Dan</th>
    <th>Ura</th>
</tr>

{% for u in urnik %}
<tr>
    <td>{{ u[0] }}</td>
    <td>{{ u[1] }}</td>
    <td>{{ u[2] }}</td>
</tr>

{% else %}
<tr>
    <td colspan="3">Ni prostih terminov.</td>
</tr>
{% endfor %}

</table>

{% endblock %}
