<!doctype html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Frizerski Salon{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --beige: #D9B99F; --light: #F2E7DD; --peach: #F2D6CE;
            --brown: #A75F37; --rose: #CA8E82; --dark: #292421;
            --font-body: 'Inter', sans-serif;
        }
        body { font-family: var(--font-body); background: var(--light); }
        .top-nav {
            background: var(--brown);
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .top-nav a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 20px;
            transition: background 0.15s;
        }
        .top-nav a:hover { background: rgba(255,255,255,0.15); color: white; }
        .top-nav .sep { color: rgba(255,255,255,0.3); font-size: 12px; }
        .top-nav .nav-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
        .top-nav .nav-right a { font-size: 12px; }
        .top-nav .logout-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .top-nav .logout-btn:hover { background: rgba(255,255,255,0.25); }
        .top-nav .login-btn {
            background: var(--beige);
            color: var(--dark) !important;
            font-weight: 600;
        }
        .top-nav .login-btn:hover { background: #c9a88a; }
        main { min-height: calc(100vh - 120px); }
        footer {
            background: var(--beige);
            padding: 12px 24px;
            font-size: 12px;
            color: var(--dark);
            text-align: center;
        }
        footer a { color: var(--brown); text-decoration: none; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="/">🏠 Domov</a>
        <span class="sep">|</span>
        <a href="/saloni">💈 Saloni</a>
        <a href="/storitve">✂️ Storitve</a>
        <a href="/cenik">💰 Cenik</a>
        <a href="/rezervacije">📅 Rezervacije</a>
        <a href="/vse_rezervacije">📋 Vse rezervacije</a>
        <a href="/faq">❓ FAQ</a>

        <div class="nav-right">
            {% if session.get('user_id') %}
                <span style="color:rgba(255,255,255,0.7);font-size:12px;">👤 {{ session.get('username', '') }}</span>
                <a href="/logout" class="logout-btn">Odjava</a>
            {% else %}
                <a href="/profil" class="login-btn">Prijava</a>
                <a href="/register">Registracija</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; 2024 Upravljanje Salona &nbsp;|&nbsp; <a href="/">nazaj na začetek</a>
        &nbsp;|&nbsp; <a href="/">Hairscultures</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
