{% extends "base.html" %}
{% block title %}Profil{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --beige: #D9B99F; --light: #F2E7DD; --peach: #F2D6CE;
        --brown: #A75F37; --rose: #CA8E82; --dark: #292421; --white: #FFFFFF;
        --font-head: 'Inknut Antiqua', serif; --font-body: 'Inter', sans-serif;
    }
    body { font-family: var(--font-body); background: #f5f5f5; color: var(--dark); }

    .page-wrap {
        width: min(1180px, 96vw);
        margin: 42px auto;
        background: var(--white);
        min-height: 620px;
    }

    .page-header {
        background: var(--beige);
        padding: 14px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .page-header-title {
        font-family: var(--font-head);
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--dark);
    }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .header-username {
        background: rgba(255,255,255,0.75);
        border-radius: 18px;
        padding: 7px 22px;
        font-family: var(--font-head);
        font-size: 10px;
        font-weight: 600;
        color: var(--dark);
    }
    .user-avatar {
        width: 52px; height: 52px;
        border-radius: 50%;
        background: var(--white);
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; color: var(--beige);
        text-decoration: none;
    }

    .navbar {
        background: #C9977D;
        display: flex;
        padding-left: 28px;
    }
    .navbar a {
        font-size: 12px;
        font-style: italic;
        font-weight: 700;
        color: #000;
        text-decoration: none;
        padding: 13px 28px;
        display: block;
    }
    .navbar a.active { background: var(--brown); color: #000; }
    .navbar a:hover { background: rgba(167,95,55,0.25); }

    .profil-content {
        background: var(--light);
        width: 480px;
        min-height: 510px;
        margin: 0 auto;
        padding: 32px 56px 44px;
        position: relative;
    }
    .back-btn {
        position: absolute;
        top: 24px;
        right: 28px;
        font-size: 42px;
        line-height: 1;
        color: var(--beige);
        text-decoration: none;
        font-weight: 700;
        transform: rotate(8deg);
    }
    .profil-ikona {
        width: 92px; height: 92px;
        border-radius: 50%;
        background: var(--beige);
        margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        font-size: 46px;
        color: var(--white);
    }
    .profil-title {
        font-family: var(--font-head);
        font-size: 1.1rem;
        text-align: center;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
    }
    .profil-subtitle {
        text-align: center;
        font-size: 11px;
        color: #7A958F;
        margin-bottom: 28px;
    }

    .tabs {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 22px;
    }
    .tab-btn {
        border: 1px solid var(--brown);
        background: var(--white);
        color: var(--brown);
        border-radius: 18px;
        padding: 7px 22px;
        font-family: var(--font-body);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
    }
    .tab-btn.active { background: var(--brown); color: var(--white); }

    .form-box { display: none; }
    .form-box.active { display: block; }
    .polje { margin-bottom: 15px; }
    .polje label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: var(--dark);
        margin-bottom: 6px;
    }
    .polje input {
        width: 100%;
        border: none;
        border-radius: 18px;
        background: var(--white);
        padding: 8px 14px;
        font-size: 12px;
        outline: none;
        font-family: var(--font-body);
        color: var(--dark);
    }
    .polje input:focus { box-shadow: 0 0 0 1.5px var(--brown); }

    .zapomni {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--brown);
        margin: 6px 0 18px;
    }
    .zapomni input { width: 18px; height: 18px; accent-color: var(--brown); }

    .divider {
        height: 2px;
        background: var(--brown);
        margin: 16px 0 20px;
    }
    .gumb {
        display: block;
        width: 170px;
        margin: 0 auto;
        background: var(--brown);
        border: none;
        border-radius: 30px;
        padding: 11px 28px;
        font-size: 13px;
        font-family: var(--font-body);
        color: var(--white);
        cursor: pointer;
        transition: background 0.2s;
    }
    .gumb:hover { background: var(--rose); }
    .small-link {
        display: block;
        text-align: center;
        margin-top: 12px;
        font-size: 11px;
        color: var(--brown);
        text-decoration: none;
        font-style: italic;
    }
    .small-link:hover { text-decoration: underline; }

    @media (max-width: 720px) {
        .page-wrap { margin: 0; width: 100%; }
        .navbar { overflow-x: auto; padding-left: 0; }
        .navbar a { padding: 12px 18px; }
        .profil-content { width: 100%; padding: 32px 28px 44px; }
        .page-header { padding: 12px 18px; }
        .page-header-title { font-size: 1.15rem; }
        .header-username { display: none; }
    }
</style>

<div class="page-wrap">
    <div class="page-header">
        <div class="page-header-title">PROFIL</div>
        <div class="header-right">
            <span class="header-username">Ime priimek</span>
            <a href="/profil" class="user-avatar">&#128100;</a>
        </div>
    </div>

    <nav class="navbar">
        <a href="/">Domov</a>
        <a href="/saloni">Saloni</a>
        <a href="/storitve">Storitve</a>
        <a href="/termini">Termini</a>
        <a href="/qga">Q &amp; A</a>
    </nav>

    <main class="profil-content">
        <a href="/" class="back-btn">&#8617;</a>

        <div class="profil-ikona">&#128100;</div>
        <h1 class="profil-title">PRIJAVA / REGISTRACIJA</h1>
        <p class="profil-subtitle">Prijavite se ali ustvarite nov uporabniški račun.</p>

        <div class="tabs">
            <button type="button" class="tab-btn active" id="tab-prijava" onclick="showForm('prijava')">Prijava</button>
            <button type="button" class="tab-btn" id="tab-registracija" onclick="showForm('registracija')">Registracija</button>
        </div>

        <form method="POST" action="/login" id="form-prijava" class="form-box active">
            <div class="polje">
                <label for="login-username">Uporabniško ime ali e-poštni naslov</label>
                <input type="text" id="login-username" name="username" required>
            </div>
            <div class="polje">
                <label for="login-password">Geslo</label>
                <input type="password" id="login-password" name="password" required>
            </div>
            <label class="zapomni">
                <input type="checkbox" name="remember"> Zapomni se me
            </label>
            <div class="divider"></div>
            <button class="gumb" type="submit">Potrdi</button>
            <a href="#" class="small-link">Ste pozabili geslo?</a>
        </form>

        <form method="POST" action="/register" id="form-registracija" class="form-box">
            <div class="polje">
                <label for="reg-username">Uporabniško ime</label>
                <input type="text" id="reg-username" name="username" required>
            </div>
            <div class="polje">
                <label for="reg-email">E-poštni naslov</label>
                <input type="email" id="reg-email" name="email" required>
            </div>
            <div class="polje">
                <label for="reg-password">Geslo</label>
                <input type="password" id="reg-password" name="password" required>
            </div>
            <div class="polje">
                <label for="reg-password2">Ponovi geslo</label>
                <input type="password" id="reg-password2" name="password2" required>
            </div>
            <div class="divider"></div>
            <button class="gumb" type="submit">Registriraj se</button>
        </form>
    </main>
</div>

<script>
    function showForm(type) {
        const prijava = document.getElementById('form-prijava');
        const registracija = document.getElementById('form-registracija');
        const tabPrijava = document.getElementById('tab-prijava');
        const tabRegistracija = document.getElementById('tab-registracija');

        if (type === 'prijava') {
            prijava.classList.add('active');
            registracija.classList.remove('active');
            tabPrijava.classList.add('active');
            tabRegistracija.classList.remove('active');
        } else {
            registracija.classList.add('active');
            prijava.classList.remove('active');
            tabRegistracija.classList.add('active');
            tabPrijava.classList.remove('active');
        }
    }
</script>
{% endblock %}
